<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240" role="img" aria-label="Sparse MLP neurons, a few highly active, above a rising persistence curve">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#11161f"/>
      <stop offset="100%" stop-color="#1c2331"/>
    </linearGradient>
    <radialGradient id="hot">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="60%" stop-color="#f4a13c"/>
      <stop offset="100%" stop-color="#e2711d"/>
    </radialGradient>
  </defs>

  <rect width="320" height="240" fill="url(#bg)"/>

  <!-- neuron grid: mostly dim, a sparse few carrying the signal -->
  <g>
    <!-- dim neurons -->
    <g fill="#39465c">
      <circle cx="34"  cy="40" r="6"/><circle cx="74"  cy="40" r="6"/>
      <circle cx="154" cy="40" r="6"/><circle cx="194" cy="40" r="6"/>
      <circle cx="234" cy="40" r="6"/><circle cx="286" cy="40" r="6"/>
      <circle cx="34"  cy="84" r="6"/><circle cx="114" cy="84" r="6"/>
      <circle cx="154" cy="84" r="6"/><circle cx="234" cy="84" r="6"/>
      <circle cx="286" cy="84" r="6"/>
      <circle cx="74"  cy="128" r="6"/><circle cx="114" cy="128" r="6"/>
      <circle cx="194" cy="128" r="6"/><circle cx="234" cy="128" r="6"/>
      <circle cx="286" cy="128" r="6"/>
    </g>
    <!-- the importance neurons -->
    <g fill="url(#hot)">
      <circle cx="114" cy="40"  r="10"/>
      <circle cx="74"  cy="84"  r="12"/>
      <circle cx="194" cy="84"  r="9"/>
      <circle cx="34"  cy="128" r="9"/>
      <circle cx="154" cy="128" r="11"/>
    </g>
    <g fill="none" stroke="#f4a13c" stroke-opacity="0.35" stroke-width="1.5">
      <path d="M114 40 L74 84"/>
      <path d="M74 84 L34 128"/>
      <path d="M74 84 L154 128"/>
      <path d="M194 84 L154 128"/>
    </g>
  </g>

  <!-- persistence curve rising off the activated neurons -->
  <path d="M24 206 C 78 202, 104 190, 132 172 S 196 128, 232 108 S 282 82, 300 74"
        fill="none" stroke="#6fd3c7" stroke-width="3" stroke-linecap="round"/>
  <g fill="#6fd3c7">
    <circle cx="132" cy="172" r="3.5"/>
    <circle cx="232" cy="108" r="3.5"/>
    <circle cx="300" cy="74"  r="3.5"/>
  </g>
  <line x1="24" y1="206" x2="300" y2="206" stroke="#39465c" stroke-width="2"/>
  <line x1="24" y1="206" x2="24"  y2="64"  stroke="#39465c" stroke-width="2"/>
</svg>
